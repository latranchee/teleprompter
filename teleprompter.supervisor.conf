[program:teleprompter]
command=/usr/bin/python3 /opt/teleprompter/server.py
directory=/opt/teleprompter
autostart=true
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/teleprompter.log
stderr_logfile=/var/log/teleprompter.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1",PATH="/usr/local/bin:/usr/bin:/bin"
